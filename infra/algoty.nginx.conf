server {
    listen 80;
    server_name algoty.com www.algoty.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name algoty.com www.algoty.com;
    ssl_certificate /etc/ssl/cloudflare/algoty.pem;
    ssl_certificate_key /etc/ssl/cloudflare/algoty.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /api/v2/session {
        limit_req zone=exchange_sessions burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18200;
        include /etc/nginx/snippets/exchange-lab-proxy.conf;
    }
    location ~ ^/api/v2/(register|login|recover)$ {
        limit_req zone=exchange_sessions burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18200;
        include /etc/nginx/snippets/exchange-lab-proxy.conf;
    }
    location /api/ {
        limit_req zone=exchange_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18200;
        include /etc/nginx/snippets/exchange-lab-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:18200;
        include /etc/nginx/snippets/exchange-lab-proxy.conf;
    }
}
